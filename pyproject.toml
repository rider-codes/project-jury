[project]
name = "jury"
version = "0.1.0"
description = "A panel of AI personas that review a software project and give evidence-based verdicts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "playwright>=1.65.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
